# Optional. Only use this if you want Nginx in front of the app.
# This block listens on 3000 and does not replace existing :80 / :443 sites.
#
# Recommended Digital Ocean setup does NOT need Nginx: run uvicorn on :3000
# and it will serve both the API and the built frontend.

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /hepharna/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
